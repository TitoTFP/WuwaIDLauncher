[package]
name = "wuwaid-launcher"
version = "2.8.0"
description = "Launcher & Patch Installer Bahasa Indonesia untuk Wuthering Waves"
authors = ["WuwaID Team"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "wuwaid_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "custom-protocol", "test"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
log = "0.4"
quick-xml = "0.41.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_Security"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
