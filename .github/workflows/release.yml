name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (vX.Y.Z). Kosongkan untuk auto-bump patch dari rilis terakhir.'
        required: false
        type: string

permissions:
  contents: write

# Serialize releases; never cancel one that's already running.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Run consistency checks
        run: bash tests/verify_launcher_consistency.sh

      - name: Run unit tests
        run: dotnet test WuwaIDLauncher.Tests/WuwaIDLauncher.Tests.csproj --no-restore -c Release --verbosity normal

      - name: Resolve and validate tag
        id: tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $input = "${{ github.event.inputs.tag }}".Trim()
            if ([string]::IsNullOrWhiteSpace($input)) {
              # Auto-bump patch from the latest published release.
              $latest = gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>$null
              if (-not $latest -or $latest -notmatch '^v([0-9]+)\.([0-9]+)\.([0-9]+)$') {
                $tag = "v0.1.0"
              } else {
                $tag = "v$($matches[1]).$($matches[2]).$([int]$matches[3] + 1)"
              }
            } else {
              $tag = $input
            }
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag harus format vX.Y.Z, dapat: $tag"
          }
          Write-Output "name=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish (single-file, self-contained)
        run: |
          dotnet publish WuwaIDLauncher.csproj `
            -c Release `
            -p:Version=${{ steps.tag.outputs.version }} `
            -p:AssemblyVersion=${{ steps.tag.outputs.version }}.0 `
            -p:FileVersion=${{ steps.tag.outputs.version }}.0 `
            -p:InformationalVersion=${{ steps.tag.outputs.version }} `
            -o ./publish

      - name: Smoke test published exe
        run: |
          $exe = Get-Item ./publish/WuwaIDLauncher.exe -ErrorAction Stop
          if ($exe.Length -lt 10MB) {
            throw "WuwaIDLauncher.exe terlalu kecil ($($exe.Length) bytes); publish gagal?"
          }
          Write-Output "OK: WuwaIDLauncher.exe $($exe.Length) bytes"

      - name: Run end-to-end tests
        run: |
          $env:WUWAID_E2E_APPDATA = "$env:RUNNER_TEMP\wuwaid-e2e-appdata"
          $p = Start-Process -FilePath ".\publish\WuwaIDLauncher.exe" -ArgumentList "--e2e" -Wait -PassThru
          $code = $p.ExitCode
          $results = "$env:RUNNER_TEMP\wuwaid-e2e-appdata\e2e-results.txt"
          if (Test-Path $results) { Get-Content $results }
          if ($code -ne 0) { throw "E2E tests failed with exit code $code" }

      # Nama zip WAJIB pakai prefix v (WuwaIDLauncher-v{tag}.zip) —
      # self-update launcher di MainWindow.xaml.cs CheckLauncherVersion()
      # membangun URL download dari pola ini.
      - name: Create ZIP archive
        run: Compress-Archive -Path ./publish/WuwaIDLauncher.exe -DestinationPath ./WuwaIDLauncher-${{ steps.tag.outputs.name }}.zip

      - name: Create checksum
        id: checksum
        run: |
          $zip = "WuwaIDLauncher-${{ steps.tag.outputs.name }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path ./SHA256sums.txt -Value "$hash  $zip"
          Write-Output "checksum=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WuwaIDLauncher ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            **Checksum (SHA-256)**
            ```
            ${{ steps.checksum.outputs.checksum }}  WuwaIDLauncher-${{ steps.tag.outputs.name }}.zip
            ```
          files: |
            ./WuwaIDLauncher-${{ steps.tag.outputs.name }}.zip
            ./SHA256sums.txt
