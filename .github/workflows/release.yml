name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.9.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG.Trim() } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag release harus memakai format vX.Y.Z: $tag"
          }
          $version = $tag.TrimStart('v')
          $packageVersion = (Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json).version
          if ([string]$packageVersion -ne $version) {
            throw "Versi tag $version tidak sama dengan package.json $packageVersion"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate curated release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = ".github/release-notes/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Curated release notes tidak ditemukan: $notes"
          }
          Write-Host "Using curated release notes: $notes"

      - name: Check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build launcher binary
        run: npm run tauri -- build --no-bundle

      - name: Package updater archive
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $exe = Get-Item -LiteralPath "src-tauri/target/release/WuwaIDLauncher.exe" -ErrorAction Stop
          if ($exe.Length -le 1MB) {
            throw "Launcher binary terlalu kecil: $($exe.Length) bytes"
          }
          $zipName = "WuwaIDLauncher-$env:RELEASE_TAG.zip"
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath $zipName -Force
          $hash = (Get-FileHash -LiteralPath $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "SHA256sums.txt" -Value "$hash  *$zipName" -Encoding ascii
          "zip=$zipName" >> $env:GITHUB_OUTPUT
          Write-Host "$($zipName): $hash"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: WuwaID Launcher ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          body_path: .github/release-notes/${{ steps.release.outputs.tag }}.md
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            SHA256sums.txt
