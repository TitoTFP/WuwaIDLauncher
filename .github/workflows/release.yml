name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.9.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      CARGOFLAGS: --locked
      RUST_BACKTRACE: "1"
    steps:
      - name: Initialize release evidence
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "wuwaid-release-gate-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "workflow=$env:GITHUB_WORKFLOW`nsha=$env:GITHUB_SHA`nevent=$env:GITHUB_EVENT_NAME" | Set-Content -LiteralPath (Join-Path $evidence "workflow-context.txt")

      - name: Checkout exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify release tag
        id: release
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG.Trim() } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag release harus memakai format vX.Y.Z: $tag"
          }

          $head = (& git rev-parse HEAD).Trim()
          $tagCommit = (& git rev-parse "refs/tags/$tag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "Tag release tidak ditemukan pada checkout: $tag"
          }
          if ($head -ne $tagCommit) {
            throw "Checkout bukan commit tag release. HEAD=$head TAG=$tagCommit"
          }

          $version = $tag.TrimStart('v')
          $packageVersion = (Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content -Raw -LiteralPath "src-tauri/Cargo.toml"), '(?m)^\s*version\s*=\s*"(?<version>[^"\r\n]+)"').Groups["version"].Value
          $tauriVersion = (Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          if (@($packageVersion, $cargoVersion, $tauriVersion) | Where-Object { [string]$_ -ne $version }) {
            throw "Versi tag $version tidak sama dengan package.json $packageVersion, Cargo.toml $cargoVersion, dan tauri.conf.json $tauriVersion"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$head" >> $env:GITHUB_OUTPUT

      - name: Validate curated release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $notes = ".github/release-notes/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Curated release notes tidak ditemukan: $notes"
          }
          Write-Host "Using curated release notes: $notes"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Test JavaScript contracts
        run: node --test scripts/tests/game-exit-notice.test.mjs scripts/tests/resource-lifecycle.test.mjs scripts/tests/launcher-update-notification.test.mjs

      - name: Test patch status bridge
        run: npm run test:patch-status

      - name: Check release version consistency
        run: npm run test:version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1

      - name: Lint backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run deterministic Windows acceptance contracts
        shell: pwsh
        run: |
          $tests = @(
            "scripts/acceptance/wut-36-acl.tests.ps1",
            "scripts/acceptance/wut-38-launch-evidence.tests.ps1",
            "scripts/acceptance/wut-main-ui-acl.tests.ps1",
            "scripts/acceptance/wut-main-ui.tests.ps1",
            "scripts/acceptance/wut-game-lifecycle.tests.ps1"
          )
          foreach ($test in $tests) {
            & pwsh -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) {
              throw "Acceptance contract failed: $test"
            }
          }

      - name: Build launcher binary
        shell: pwsh
        run: |
          $env:CARGOFLAGS = "--locked"
          npm run tauri -- build --no-bundle

      - name: Package ZIP distribution
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $exe = Get-Item -LiteralPath "src-tauri/target/release/WuwaIDLauncher.exe" -ErrorAction Stop
          if ($exe.Length -le 1MB) {
            throw "Launcher binary terlalu kecil: $($exe.Length) bytes"
          }

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $zipName = "WuwaIDLauncher-$env:RELEASE_TAG.zip"
          $zipPath = Join-Path $artifactRoot $zipName
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath $zipPath -Force
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $artifactRoot $exe.Name) -Force
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $artifactRoot "SHA256sums.txt") -Value "$hash *$zipName" -Encoding ascii
          Copy-Item -LiteralPath ".github/release-notes/$env:RELEASE_TAG.md" -Destination (Join-Path $artifactRoot "RELEASE_NOTES.md") -Force
          Write-Host "${zipName}: $hash"

      - name: Run Windows release gate
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "wuwaid-release-gate-evidence"
          $fixture = Join-Path $env:RUNNER_TEMP "wuwaid-release-gate-fixture"
          New-Item -ItemType Directory -Force -Path $evidence, $fixture | Out-Null
          & pwsh -NoProfile -File "scripts/acceptance/windows-release-gate.ps1" `
            -Mode automated `
            -ArtifactRoot "$env:GITHUB_WORKSPACE\release-artifacts" `
            -OutputRoot $evidence `
            -FixtureRoot $fixture
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release gate failed with exit code $LASTEXITCODE"
          }

      - name: Attest release ZIP provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/WuwaIDLauncher-${{ steps.release.outputs.tag }}.zip

      - name: Upload release gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-gate-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/wuwaid-release-gate-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release payload
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload-${{ steps.release.outputs.tag }}
          path: release-artifacts
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release-production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Initialize publish evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wuwaid-release-publish-evidence"
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "sha=$GITHUB_SHA"
            echo "event=$GITHUB_EVENT_NAME"
          } > "$RUNNER_TEMP/wuwaid-release-publish-evidence/workflow-context.txt"

      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ needs.build.outputs.tag }}
          path: release-payload

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WuwaID Launcher $RELEASE_TAG" \
            --notes-file release-payload/RELEASE_NOTES.md \
            "release-payload/WuwaIDLauncher-$RELEASE_TAG.zip" \
            release-payload/SHA256sums.txt

      - name: Capture publish evidence
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          evidence="$RUNNER_TEMP/wuwaid-release-publish-evidence"
          {
            echo "tag=$RELEASE_TAG"
            echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          } >> "$evidence/workflow-context.txt"

      - name: Upload publish evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publish-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/wuwaid-release-publish-evidence
          if-no-files-found: warn
          retention-days: 30
