name: Windows acceptance

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Trusted branch or release tag to test
        required: false
        default: main
        type: string
      game_path:
        description: Installed and already patched Wuthering Waves directory
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Real Windows acceptance
    runs-on:
      - self-hosted
      - windows
      - wuwaid-trusted-windows
    timeout-minutes: 120
    env:
      CARGOFLAGS: --locked
      ACCEPTANCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
      ACCEPTANCE_GAME_PATH: ${{ inputs.game_path || vars.WUWAID_ACCEPTANCE_GAME_PATH }}
    steps:
      - name: Initialize acceptance evidence
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "wuwaid-real-acceptance"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "workflow=$env:GITHUB_WORKFLOW`nsha=$env:GITHUB_SHA" | Set-Content -LiteralPath (Join-Path $evidence "workflow-context.txt")

      - name: Validate trusted ref
        shell: pwsh
        run: |
          if ($env:ACCEPTANCE_REF -notmatch '\A(main|v\d+\.\d+\.\d+)\z') {
            throw "Only main or a semantic-version release tag may run on the trusted runner."
          }

      - name: Checkout trusted ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Test JavaScript contracts
        run: node --test scripts/tests/game-exit-notice.test.mjs scripts/tests/resource-lifecycle.test.mjs scripts/tests/launcher-update-notification.test.mjs

      - name: Test patch status bridge
        run: npm run test:patch-status

      - name: Check release version consistency
        run: npm run test:version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Windows backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1

      - name: Lint Windows backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run deterministic Windows acceptance contracts
        shell: pwsh
        run: |
          $tests = @(
            "scripts/acceptance/windows-release-gate.tests.ps1",
            "scripts/acceptance/wut-36-acl.tests.ps1",
            "scripts/acceptance/wut-38-launch-evidence.tests.ps1",
            "scripts/acceptance/wut-main-ui-acl.tests.ps1",
            "scripts/acceptance/wut-main-ui.tests.ps1",
            "scripts/acceptance/wut-game-lifecycle.tests.ps1"
          )
          foreach ($test in $tests) {
            & pwsh -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) {
              throw "Acceptance contract failed: $test"
            }
          }

      - name: Build launcher binary
        run: npm run tauri -- build --no-bundle

      - name: Run real launcher and game smoke
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACCEPTANCE_GAME_PATH)) {
            throw "Set repository variable WUWAID_ACCEPTANCE_GAME_PATH or provide workflow_dispatch game_path."
          }
          $output = Join-Path $env:RUNNER_TEMP "wuwaid-real-acceptance"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & pwsh -NoProfile -File "scripts/acceptance/run-windows-real-acceptance.ps1" `
            -LauncherPath "$env:GITHUB_WORKSPACE\src-tauri\target\release\WuwaIDLauncher.exe" `
            -GamePath $env:ACCEPTANCE_GAME_PATH `
            -OutputRoot $output
          if ($LASTEXITCODE -ne 0) {
            throw "Real Windows acceptance failed."
          }

      - name: Upload real acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-acceptance-${{ github.run_number }}
          path: ${{ runner.temp }}/wuwaid-real-acceptance
          if-no-files-found: warn
          retention-days: 14
