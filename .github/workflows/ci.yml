# CI workflow

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and JavaScript contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGOFLAGS: --locked
      RUST_BACKTRACE: "1"
    steps:
      - name: Initialize job evidence
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/wuwaid-ci-evidence/frontend"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm run test:security

      - name: Check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Test JavaScript contracts
        run: node --test scripts/tests/frontend-controls.test.mjs scripts/tests/game-exit-notice.test.mjs scripts/tests/resource-lifecycle.test.mjs scripts/tests/launcher-update-notification.test.mjs scripts/tests/workflow-contract.test.mjs scripts/tests/performance-contract.test.mjs

      - name: Test patch status bridge
        run: npm run test:patch-status

      - name: Check release version consistency
        run: npm run test:version

      - name: Capture job evidence
        if: ${{ always() }}
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/wuwaid-ci-evidence/frontend"
          {
            echo "job=frontend"
            echo "sha=$GITHUB_SHA"
            echo "event=$GITHUB_EVENT_NAME"
            git status --short || true
          } > "$evidence/summary.txt"

      - name: Upload job evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-frontend-${{ github.run_number }}
          path: ${{ runner.temp }}/wuwaid-ci-evidence/frontend
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGOFLAGS: --locked
      RUST_BACKTRACE: "1"
    steps:
      - name: Initialize job evidence
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/wuwaid-ci-evidence/rust"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1

      - name: Lint backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Capture job evidence
        if: ${{ always() }}
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/wuwaid-ci-evidence/rust"
          {
            echo "job=rust"
            echo "sha=$GITHUB_SHA"
            echo "event=$GITHUB_EVENT_NAME"
            git status --short || true
          } > "$evidence/summary.txt"

      - name: Upload job evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-rust-${{ github.run_number }}
          path: ${{ runner.temp }}/wuwaid-ci-evidence/rust
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows regression and build
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGOFLAGS: --locked
      RUST_BACKTRACE: "1"
    steps:
      - name: Initialize job evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "wuwaid-ci-evidence\windows") | Out-Null

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test Windows backend
        shell: pwsh
        run: |
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\Cargo.toml'
          cargo test --locked --manifest-path $manifest --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(
            'app_command_integration_tests',
            'backend_remediation_tests',
            'download_integration_tests',
            'game_lifecycle_windows_tests',
            'installer_safety_tests',
            'media_command_event_tests',
            'milestone1_contract_tests',
            'milestone2_contract_tests',
            'milestone3_contract_tests',
            'milestone5_contract_tests',
            'milestone6_contract_tests'
          )
          foreach ($test in $tests) {
            if ($test -eq 'game_lifecycle_windows_tests') {
              $gameTests = @(
                'direct_launch_without_dx11_handoffs_and_force_quits_verified_tree',
                'direct_launch_with_dx11_handoffs_and_force_quits_verified_tree',
                'elevated_uac_launch_handoffs_and_force_quits_with_retained_handle',
                'external_instance_is_not_claimed_or_killed_by_unrelated_launcher_tree',
                'supported_launch_modes_and_dx11_arguments_are_explicit',
                'launcher_child_handoff_stays_owned_and_force_quit_cleans_the_tree',
                'windows_handoff_commits_whats_new_after_successful_restart',
                'windows_offline_startup_reads_matching_committed_whats_new',
                'windows_acknowledgement_is_once_per_tag',
                'windows_missing_transaction_rejects_handoff_without_display',
                'windows_cancelled_update_invalidates_uncommitted_whats_new',
                'windows_failed_update_does_not_display_whats_new',
                'windows_health_check_failure_rolls_back_and_discards_whats_new',
                'windows_health_failure_stops_launched_process_before_rollback'
              )
              Write-Host "Compiling isolated backend test target: $test"
              cargo test --locked --manifest-path $manifest --test $test --no-run
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $cargoToml = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\Cargo.toml'
              if (-not (Test-Path -LiteralPath $cargoToml)) {
                Write-Host "Workspace changed while compiling backend test target: $test"
                git status --short
                exit 1
              }
              foreach ($gameTest in $gameTests) {
                Write-Host "Running isolated backend test: $gameTest"
                cargo test --locked --manifest-path $manifest --test $test $gameTest -- --exact --test-threads=1 --nocapture
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                $cargoToml = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\Cargo.toml'
                if (-not (Test-Path -LiteralPath $cargoToml)) {
                  Write-Host "Workspace changed after backend test: $gameTest"
                  git status --short
                  exit 1
                }
              }
              continue
            }
            Write-Host "Running isolated backend test target: $test"
            cargo test --locked --manifest-path $manifest --test $test -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $cargoToml = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\Cargo.toml'
            if (-not (Test-Path -LiteralPath $cargoToml)) {
              Write-Host "Workspace changed after backend test target: $test"
              git status --short
              exit 1
            }
          }

      - name: Verify Windows workspace after backend tests
        shell: pwsh
        run: |
          Write-Host "Location: $(Get-Location)"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Cargo manifest exists: $(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'src-tauri\Cargo.toml'))"
          git status --short
          Get-ChildItem -Force (Join-Path $env:GITHUB_WORKSPACE 'src-tauri') | Select-Object Name,Length,Mode

      - name: Lint Windows backend
        run: cargo clippy --locked --manifest-path "${env:GITHUB_WORKSPACE}\src-tauri\Cargo.toml" --all-targets -- -D warnings

      - name: Run Windows static acceptance contracts
        shell: pwsh
        run: |
          $tests = @(
            "scripts/acceptance/windows-release-gate.tests.ps1",
            "scripts/acceptance/wut-36-acl.tests.ps1",
            "scripts/acceptance/wut-38-launch-evidence.tests.ps1",
            "scripts/acceptance/wut-main-ui-acl.tests.ps1",
            "scripts/acceptance/wut-main-ui.tests.ps1",
            "scripts/acceptance/wut-game-lifecycle.tests.ps1"
          )
          foreach ($test in $tests) {
            & pwsh -NoProfile -File $test
            if ($LASTEXITCODE -ne 0) {
              throw "Acceptance contract failed: $test"
            }
          }

      - name: Build launcher binary
        run: npm run tauri -- build --no-bundle

      - name: Validate launcher artifact
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath "src-tauri/target/release/WuwaIDLauncher.exe" -ErrorAction Stop
          if ($exe.Length -le 1MB) {
            throw "Launcher binary terlalu kecil: $($exe.Length) bytes"
          }
          Write-Host "WuwaIDLauncher.exe: $($exe.Length) bytes"

      - name: Upload launcher artifact
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WuwaIDLauncher-ci-${{ github.run_number }}
          path: src-tauri/target/release/WuwaIDLauncher.exe
          if-no-files-found: error
          retention-days: 7

      - name: Capture job evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "wuwaid-ci-evidence\windows"
          @(
            "job=windows",
            "sha=$env:GITHUB_SHA",
            "event=$env:GITHUB_EVENT_NAME"
          ) | Set-Content -LiteralPath (Join-Path $evidence "summary.txt")
          if (Test-Path -LiteralPath ".git") {
            git status --short | Add-Content -LiteralPath (Join-Path $evidence "summary.txt")
          }

      - name: Upload job evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-windows-${{ github.run_number }}
          path: ${{ runner.temp }}/wuwaid-ci-evidence/windows
          if-no-files-found: warn
          retention-days: 14

  windows-performance:
    name: Windows fixture performance
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGOFLAGS: --locked
      RUST_BACKTRACE: "1"
    steps:
      - name: Initialize job evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "wuwaid-ci-evidence\\windows-performance") | Out-Null

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build launcher binary
        run: npm run tauri -- build --no-bundle

      - name: Run Windows fixture performance matrix
        shell: pwsh
        run: |
          & pwsh -NoProfile -File "scripts/acceptance/run-windows-fixture-performance.ps1" `
            -OutputRoot "$env:GITHUB_WORKSPACE\\performance-evidence"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows fixture performance matrix failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows fixture performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-fixture-performance-${{ github.run_number }}
          path: performance-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Capture job evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "wuwaid-ci-evidence\\windows-performance"
          @(
            "job=windows-performance",
            "sha=$env:GITHUB_SHA",
            "event=$env:GITHUB_EVENT_NAME"
          ) | Set-Content -LiteralPath (Join-Path $evidence "summary.txt")
          if (Test-Path -LiteralPath ".git") {
            git status --short | Add-Content -LiteralPath (Join-Path $evidence "summary.txt")
          }

      - name: Upload job evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-windows-performance-${{ github.run_number }}
          path: ${{ runner.temp }}/wuwaid-ci-evidence/windows-performance
          if-no-files-found: warn
          retention-days: 14
