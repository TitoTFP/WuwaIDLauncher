name: Build Testing Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-testing:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run consistency checks
        run: bash tests/verify_launcher_consistency.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish testing build
        run: |
          dotnet publish WuwaIDLauncher.csproj `
            -c Release `
            -p:Version=0.0.1 `
            -p:AssemblyVersion=0.0.1.0 `
            -p:FileVersion=0.0.1.0 `
            -p:InformationalVersion=0.0.1 `
            -o ./publish

      - name: Run unit tests
        run: dotnet test WuwaIDLauncher.Tests/WuwaIDLauncher.Tests.csproj --no-restore -c Release --verbosity normal

      - name: Run end-to-end tests
        run: |
          $env:WUWAID_E2E_APPDATA = "$env:RUNNER_TEMP\wuwaid-e2e-appdata"
          & ".\publish\WuwaIDLauncher.exe" --e2e
          $code = $LASTEXITCODE
          $results = "$env:RUNNER_TEMP\wuwaid-e2e-appdata\e2e-results.txt"
          if (Test-Path $results) { Get-Content $results }
          if ($code -ne 0) { throw "E2E tests failed with exit code $code" }

      - name: Upload testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: WuwaIDLauncher-testing-${{ github.run_number }}
          path: ./publish/WuwaIDLauncher.exe
          if-no-files-found: error
          retention-days: 1
