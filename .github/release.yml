# Customize GitHub's automatically generated release notes.
# Ref: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# PR diberi label berikut untuk dikelompokkan di release notes:
#   enhancement / feature  -> Fitur Baru
#   bug / fix              -> Perbaikan
#   chore / refactor / dependencies -> Pemeliharaan
# Tidak berlabel           -> Lainnya
# skip-changelog           -> disembunyikan dari notes
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🚀 Fitur Baru"
      labels:
        - enhancement
        - feature
    - title: "🐛 Perbaikan"
      labels:
        - bug
        - fix
    - title: "🔧 Pemeliharaan"
      labels:
        - chore
        - refactor
        - dependencies
        - docs
    - title: "📦 Lainnya"
      labels:
        - "*"